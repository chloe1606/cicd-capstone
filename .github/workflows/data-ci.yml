name: Data CI

on:
  pull_request:
    paths:
      - "pyramid_lab/**"

jobs:
  pyramid-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pytest duckdb

      - name: Run pyramid tests
        run: |
          pytest -v pyramid_lab/tests