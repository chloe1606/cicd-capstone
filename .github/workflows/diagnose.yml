name: CI
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/deploy.sh
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}


# The workflow only triggered on pull_request. A push to main did not match on:, so the workflow did not run at all on merge. Add push: branches: [main] to on:.
# SNOWFLAKE_PASSWORD: $SNOWFLAKE_PASSWORD is shell interpolation, not Actions expression syntax. The runner expanded $SNOWFLAKE_PASSWORD against its own environment, which was empty. Use ${{ secrets.SNOWFLAKE_PASSWORD }}.
# The deploy job had no actions/checkout@v7, so ./scripts/deploy.sh did not exist on the runner. Add the checkout step.