name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - run: ./scripts/leaky-deploy.sh dev
        env:
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: uat

    steps:
      - uses: actions/checkout@v4

      - run: ./scripts/leaky-deploy.sh uat
        env:
          UAT_DB_PASSWORD: ${{ secrets.UAT_DB_PASSWORD }}